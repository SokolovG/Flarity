[project]
name = "log-analyzer"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiogram>=3.23.0",
    "aiogram-dialog>=2.4.0",
    "apscheduler>=3.11.1",
    "dishka>=1.7.2",
    "h2>=4.3.0",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "msgspec>=0.19.0",
    "pre-commit>=4.4.0",
    "pydantic-settings>=2.12.0",
    "redis>=7.1.0",
]


[tool.ruff]
line-length = 100
target-version = "py312"
indent-width = 4
extend-exclude = ["tests", "alembic"]

[tool.ruff.lint]
ignore = ["D100", "D101", "D104", "D105", "D103", "D102", "D107"]
select = ["I"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.ty.rules]
#TODO


[dependency-groups]
dev = ["ty>=0.0.12"]
